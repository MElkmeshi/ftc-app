services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        env_file: .env.docker
        environment:
            CONTAINER_ROLE: app
        volumes:
            - ./database:/var/www/html/database
            - ./storage/app:/var/www/html/storage/app
            - ./storage/logs:/var/www/html/storage/logs
        restart: unless-stopped

    nginx:
        image: nginx:alpine
        depends_on:
            - app
        ports:
            # Herd/Valet already owns 127.0.0.1:80 on this machine -- use a
            # dedicated port instead of fighting over 80.
            - '8090:80'
        volumes:
            - ./public:/var/www/html/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        restart: unless-stopped

    reverb:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        env_file: .env.docker
        environment:
            CONTAINER_ROLE: worker
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        volumes:
            - ./database:/var/www/html/database
            - ./storage/logs:/var/www/html/storage/logs
        ports:
            - '8081:8080'
        # The base image's default healthcheck assumes php-fpm; this container
        # runs `reverb:start` instead, so check the actual socket it opens.
        healthcheck:
            test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 10s
        restart: unless-stopped

    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        env_file: .env.docker
        environment:
            CONTAINER_ROLE: worker
        command: php artisan queue:work --tries=3 --sleep=1
        volumes:
            - ./database:/var/www/html/database
            - ./storage/logs:/var/www/html/storage/logs
        # No HTTP endpoint to check here (it's a worker, not php-fpm) --
        # disable the base image's default php-fpm healthcheck.
        healthcheck:
            disable: true
        restart: unless-stopped
